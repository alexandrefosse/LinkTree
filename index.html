<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Linktree</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid white;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .link {
      display: block;
      background: white;
      color: #333;
      text-decoration: none;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .link:hover {
      background: #ddd;
      transform: scale(1.05);
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="image/unnamed.jpg" alt="photo">

    <h1>Alexandre</h1>
    <p>Mes liens</p>

    <a class="link" href="#">Instagram</a>
    <a class="link" href="#">YouTube</a>
    <a class="link" href="#">Portfolio</a>
    <a class="link" href="#">Contact</a>
  </div>

</body>
</html>
